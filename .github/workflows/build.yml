name: Build

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Create placeholder credentials
        run: |
          foreach ($name in @("GoogleDriveCredentials", "OneDriveCredentials", "DropboxCredentials")) {
            $template = Get-Content "YMM4CloudSync.Core/Services/$name.cs.example" -Raw
            $content = $template -replace 'PLACEHOLDER_CLIENT_ID', 'placeholder-client-id'
            $content = $content -replace 'PLACEHOLDER_CLIENT_SECRET', 'placeholder-client-secret'
            Set-Content "YMM4CloudSync.Core/Services/$name.cs" $content
          }

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test YMM4CloudSync.Tests/YMM4CloudSync.Tests.csproj --configuration Release --no-build
